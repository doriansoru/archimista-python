{% extends 'archive/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h2 class="mb-0">Conferma cancellazione</h2>
            </div>
            <div class="card-body">
                <p class="lead">Sei sicuro di voler eliminare il fondo <strong>"{{ object.name }}"</strong>?</p>
                <div class="alert alert-warning">
                    <p class="mb-0">Attenzione: verranno eliminate anche tutte le unità e le sotto-unità collegate.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'archive:fond_detail' object.pk %}" class="btn btn-secondary">Annulla</a>
                        <button type="submit" class="btn btn-danger">Elimina definitivamente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
