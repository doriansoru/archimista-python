{% extends 'archive/base.html' %}
{% block title %}Elimina compilatore - Archimista{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Elimina compilatore</h2>
    <a href="{% url 'archive:editor_list' %}" class="btn btn-outline-secondary">Torna alla lista</a>
</div>
<div class="card shadow-sm"><div class="card-body">
    <form method="post">
        {% csrf_token %}
        <p>Sei sicuro di voler eliminare il compilatore <strong>{{ editor }}</strong>?</p>
        <div class="mt-3">
            <button type="submit" class="btn btn-danger">Elimina</button>
            <a href="{% url 'archive:editor_list' %}" class="btn btn-outline-secondary">Annulla</a>
        </div>
    </form>
</div></div>
{% endblock %}
