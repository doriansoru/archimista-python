name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. v0.55.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Collect static files
        run: python manage.py collectstatic --no-input --clear

      - name: Build with PyInstaller
        run: pyinstaller --clean archimista.spec

      - name: Create distribution zip
        run: |
          Compress-Archive -Path dist\archimista\* -DestinationPath Archimista-${{ github.event.inputs.version }}.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.event.inputs.version }}
          name: Archimista ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Archimista-${{ github.event.inputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
